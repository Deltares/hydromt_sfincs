global:
  data_libs:
    - data_catalog_v1

scenarios:
  river_flood:
    steps:
      - config.update:
          rstfile: "C:/PhD/SFINCS/SFINCS_cloned/output/sfincs_620947/sfincs.20181210.000000.rst"
          # rstfile: "C:/PhD/SFINCS/SFINCS_cloned/output/sfincs_{delta_basin_id}/sfincs.20181210.000000.rst" # goal 
          dtmapout: 259200 # output every 3 days 
          dtmaxout: 259200 # output every 3 days
      - discharge_points.create_timeseries: 
          index: [0] 
          shape: "gaussian"
          offset: "{discharge_offset}" 
          peak: "{discharge_peak}"
          tpeak: 1296000
          duration: 604800
          timestep: 600
      
      # OR something like this 
      # - discharge_points.create:
      #     timeseries: data//compound_dis_timeseries.csv
        
  coastal_flood: 
    steps:
      - config.update:
          rstfile: "C:/PhD/SFINCS/SFINCS_cloned/output/sfincs_620947/sfincs.20181210.000000.rst"
          # rstfile: "C:/PhD/SFINCS/SFINCS_cloned/output/sfincs_{delta_basin_id}/sfincs.20181210.000000.rst" # goal
          dtmapout: 259200 # output every 3 days 
          dtmaxout: 259200 # output every 3 days
      - water_level.create_timeseries: 
          shape: "gaussian"
          offset: 0.5
          peak: 3
          tpeak: 1296000
          duration: 172800
          timestep: 600

  # or something like this
